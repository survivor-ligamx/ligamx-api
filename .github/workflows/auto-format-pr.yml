name: Format and validate predictor PR
on:
  push:
    branches: [copilot/mejora-get-predict]
    paths: [.github/workflows/auto-format-pr.yml]
permissions:
  contents: write
jobs:
  format-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check --fix app/ tests/
      - run: ruff format app/ tests/
      - run: |
          rm .github/workflows/auto-format-pr.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format reviewed predictor changes"
          git push
      - run: mypy app/
      - run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci.db
      - run: pytest -q
