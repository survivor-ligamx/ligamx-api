name: Fix week typing

on:
  push:
    branches:
      - copilot/fix-week-numbering-bug

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fix-week-numbering-bug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch optional week typing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/sync_service.py")
          text = path.read_text()
          old = "\n".join([
              '        raw_week = match.get("week")',
              "        try:",
              "            week = int(raw_week)",
              "        except (TypeError, ValueError):",
              "            week = 0",
          ]) + "\n"
          new = "\n".join([
              '        raw_week = match.get("week")',
              "        if raw_week is None:",
              "            week = 0",
              "        else:",
              "            try:",
              "                week = int(raw_week)",
              "            except (TypeError, ValueError):",
              "                week = 0",
          ]) + "\n"
          if old not in text:
              raise SystemExit("Expected optional week block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate and commit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ruff check app/services/sync_service.py tests/test_week_numbers.py
          mypy app/
          pytest -q tests/test_week_numbers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/sync_service.py
          git commit -m "fix(sync): manejar week opcional antes de normalizar"
          git push origin HEAD:copilot/fix-week-numbering-bug
