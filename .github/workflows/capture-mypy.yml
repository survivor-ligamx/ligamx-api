name: Capture mypy diagnostics

on:
  push:
    branches:
      - copilot/fix-week-numbering-bug

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fix-week-numbering-bug
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Capture mypy output
        run: |
          mypy app/ --no-color-output > mypy-diagnostic.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mypy-diagnostic.txt
          git diff --cached --quiet && exit 0
          git commit -m "ci: guardar diagnóstico temporal de mypy"
          git push origin HEAD:copilot/fix-week-numbering-bug
