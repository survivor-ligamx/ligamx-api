name: Patch week numbering spacing

on:
  push:
    branches:
      - copilot/fix-week-numbering-bug

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fix-week-numbering-bug
      - name: Fix top-level function spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/sync_service.py")
          text = path.read_text()
          old = '            match["week"] = fallback_by_window[window]\n\ndef compute_standings_from_matches'
          new = '            match["week"] = fallback_by_window[window]\n\n\ndef compute_standings_from_matches'
          if old not in text:
              raise SystemExit("Expected spacing target not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit spacing fix
        run: |
          python -m py_compile app/services/sync_service.py tests/test_week_numbers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/sync_service.py
          git commit -m "style: separar funciones de nivel superior"
          git push origin HEAD:copilot/fix-week-numbering-bug
