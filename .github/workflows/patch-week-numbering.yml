name: Patch week numbering branch

on:
  push:
    branches:
      - copilot/fix-week-numbering-bug

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fix-week-numbering-bug
      - name: Apply exact source block
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/sync_service.py")
          text = path.read_text()
          start = text.index("def calculate_week_numbers(")
          end = text.index("def compute_standings_from_matches", start)
          lines = [
              "def calculate_week_numbers(matches: List[Dict[str, Any]]):",
              "    \"\"\"Normaliza la jornada oficial y solo la infiere cuando falta.",
              "",
              "    ESPN y 365Scores ya publican el numero de jornada. Ese dato es la",
              "    fuente de verdad: una jornada doble puede comenzar entre semana y",
              "    atravesar la ventana calendario viernes-jueves. La fecha queda como",
              "    fallback para fuentes que realmente no entreguen ``week``.",
              "    \"\"\"",
              "",
              "    def week_start(date):",
              "        days_since_friday = (date.weekday() - 4) % 7",
              "        return (date - timedelta(days=days_since_friday)).date()",
              "",
              "    dated = [m for m in matches if m.get(\"match_date\")]",
              "    official_by_window: dict[Any, set[int]] = {}",
              "    missing = []",
              "    for match in matches:",
              "        raw_week = match.get(\"week\")",
              "        try:",
              "            week = int(raw_week)",
              "        except (TypeError, ValueError):",
              "            week = 0",
              "        if week > 0:",
              "            match[\"week\"] = week",
              "            if match.get(\"match_date\"):",
              "                window = week_start(match[\"match_date\"])",
              "                official_by_window.setdefault(window, set()).add(week)",
              "        elif match.get(\"match_date\"):",
              "            missing.append(match)",
              "",
              "    if not missing:",
              "        return",
              "",
              "    sorted_windows = sorted({week_start(m[\"match_date\"]) for m in dated})",
              "    fallback_by_window = {window: index + 1 for index, window in enumerate(sorted_windows)}",
              "    for match in missing:",
              "        window = week_start(match[\"match_date\"])",
              "        official = official_by_window.get(window, set())",
              "        if len(official) == 1:",
              "            match[\"week\"] = next(iter(official))",
              "        else:",
              "            match[\"week\"] = fallback_by_window[window]",
              "",
              "",
          ]
          replacement = "\n".join(lines)
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Commit corrected source
        run: |
          python -m py_compile app/services/sync_service.py tests/test_week_numbers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/sync_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(sync): restaurar indentación válida de jornadas"
          git push origin HEAD:copilot/fix-week-numbering-bug
