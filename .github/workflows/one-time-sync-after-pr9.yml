name: One-time sync after PR 9

on:
  push:
    branches:
      - ops/sync-after-pr9

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ops/sync-after-pr9
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/migrate.py

      - name: Show DB target (sanitized) + fingerprint
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/db_fingerprint.py

      - name: Run sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: python sync.py

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-sync-after-pr9.yml
          git commit -m "ops: retirar workflow temporal tras sync PR 9"
          git push
