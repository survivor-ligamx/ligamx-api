name: Apply manual review fixes
on:
  push:
    branches: [copilot/mejora-get-predict]
    paths:
      - tools/apply_manual_review_fixes.py
      - .github/workflows/apply-manual-review-fixes.yml
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/apply_manual_review_fixes.py
      - run: |
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: prevent season leakage and preserve home prior"
          git push
      - run: pip install -r requirements.txt
      - run: pytest -q tests/test_api.py
