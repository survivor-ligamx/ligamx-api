name: Targeted format
on:
  push:
    branches: [copilot/mejora-get-predict]
    paths: [.github/workflows/targeted-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: |
          ruff check --fix --unsafe-fixes app/routers/analytics.py tests/test_api.py || true
          ruff format app/routers/analytics.py tests/test_api.py
          rm .github/workflows/targeted-format.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style: format predictor changes"
          git push
