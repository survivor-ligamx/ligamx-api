name: Apply PR 9 implementation

on:
  push:
    branches:
      - fix/jornadas-oficiales-365

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jornadas-oficiales-365
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch sync service
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("app/services/sync_service.py")
          text = path.read_text(encoding="utf-8")
          marker = "\n\ndef _sync_sofascore_event_ids(db):\n"
          lines = [
              "",
              "",
              "def merge_official_week_numbers(matches, official_matches):",
              "    \"\"\"Reemplaza jornadas con una fuente equivalente por equipos y fecha.\"\"\"",
              "    updated = 0",
              "    for match in matches:",
              "        home = match.get(\"home_team\")",
              "        away = match.get(\"away_team\")",
              "        match_date = match.get(\"match_date\")",
              "        if not home or not away or not match_date:",
              "            continue",
              "        for official in official_matches:",
              "            try:",
              "                week = int(official.get(\"week\") or 0)",
              "            except (TypeError, ValueError):",
              "                continue",
              "            official_date = official.get(\"match_date\")",
              "            if week <= 0 or not official_date:",
              "                continue",
              "            if not (",
              "                _teams_match(home, official.get(\"home_team\"))",
              "                and _teams_match(away, official.get(\"away_team\"))",
              "            ):",
              "                continue",
              "            if abs((match_date.date() - official_date.date()).days) > 2:",
              "                continue",
              "            if match.get(\"week\") != week:",
              "                match[\"week\"] = week",
              "                updated += 1",
              "            break",
              "    return updated",
          ]
          assert text.count(marker) == 1
          text = text.replace(marker, "\n".join(lines) + marker, 1)
          old = "    calculate_week_numbers(raw_matches)\n"
          replacement = [
              "    if source == \"espn\":",
              "        try:",
              "            from app.scrapers.scores365_scraper import Scores365Scraper",
              "",
              "            official_matches = Scores365Scraper().get_matches()",
              "            updated_weeks = merge_official_week_numbers(raw_matches, official_matches)",
              "            logger.info(f\"Jornadas reconciliadas con 365Scores: {updated_weeks}\")",
              "        except Exception as e:",
              "            logger.warning(f\"No se pudieron reconciliar jornadas con 365Scores: {e}\")",
              "",
              "    calculate_week_numbers(raw_matches)",
              "",
          ]
          assert text.count(old) == 1
          path.write_text(text.replace(old, "\n".join(replacement), 1), encoding="utf-8")
          PY
          pip install -r requirements.txt
          pip install ruff pytest
          ruff check --fix app/services/sync_service.py tests/test_week_numbers_365.py
          ruff format app/services/sync_service.py tests/test_week_numbers_365.py
          pytest -q tests/test_week_numbers.py tests/test_week_numbers_365.py
      - name: Commit implementation and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-pr9.yml
          git add app/services/sync_service.py tests/test_week_numbers_365.py
          git commit -m "fix(sync): reconciliar jornadas con 365Scores"
          git push
