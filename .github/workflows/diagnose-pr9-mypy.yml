name: Diagnose PR 9 mypy

on:
  push:
    branches:
      - fix/jornadas-oficiales-365

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/jornadas-oficiales-365
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Capture mypy output
        run: |
          mkdir -p .github/tmp
          mypy app/services/sync_service.py > .github/tmp/pr9-mypy.txt 2>&1 || true
      - name: Commit diagnostics and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-pr9-mypy.yml
          git add .github/tmp/pr9-mypy.txt
          git commit -m "chore: guardar diagnostico mypy del PR 9"
          git push
