name: Capture CI diagnostics
on:
  push:
    branches: [copilot/mejora-get-predict]
    paths: [.github/workflows/diagnose-ci.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: |
          : > ci-diagnostics.txt
          echo '=== RUFF CHECK ===' >> ci-diagnostics.txt
          ruff check app/ tests/ >> ci-diagnostics.txt 2>&1 || true
          echo '=== MYPY ===' >> ci-diagnostics.txt
          mypy app/ >> ci-diagnostics.txt 2>&1 || true
          echo '=== ALEMBIC ===' >> ci-diagnostics.txt
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head >> ci-diagnostics.txt 2>&1 || true
          echo '=== PYTEST ===' >> ci-diagnostics.txt
          pytest -q >> ci-diagnostics.txt 2>&1 || true
          rm .github/workflows/diagnose-ci.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: record CI diagnostics"
          git push
