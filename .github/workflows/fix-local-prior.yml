name: Fix home prior
on:
  push:
    branches: [copilot/mejora-get-predict]
    paths: [.github/workflows/fix-local-prior.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/routers/analytics.py')
          s = p.read_text()
          old = """    exp_h = max(0.05, home_rates[\"reg_gf_rate\"] * (away_rates[\"reg_ga_rate\"] / base_avg))
              exp_a = max(0.05, away_rates[\"reg_gf_rate\"] * (home_rates[\"reg_ga_rate\"] / base_avg))
          """
          new = """    exp_h = max(
                  0.05,
                  league[\"home_avg\"]
                  * (home_rates[\"reg_gf_rate\"] / base_avg)
                  * (away_rates[\"reg_ga_rate\"] / base_avg),
              )
              exp_a = max(
                  0.05,
                  league[\"away_avg\"]
                  * (away_rates[\"reg_gf_rate\"] / base_avg)
                  * (home_rates[\"reg_ga_rate\"] / base_avg),
              )
          """
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          pip install ruff
          ruff check --fix app/routers/analytics.py tests/test_api.py
          ruff format app/routers/analytics.py tests/test_api.py
          rm -f ci-diagnostics.txt .github/workflows/fix-local-prior.yml
          git config user.name "Mini manual fixer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve venue advantage in regularized lambdas"
          git push
