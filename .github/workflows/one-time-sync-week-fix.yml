name: One-time sync after week fix

on:
  push:
    branches:
      - ops/sync-after-week-fix

permissions:
  contents: write

concurrency:
  group: sync-liga-mx
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/sync-after-week-fix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Migrate and show sanitized target
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scripts/migrate.py
          python scripts/db_fingerprint.py
      - name: Sync production data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        run: python sync.py
      - name: Remove one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-sync-week-fix.yml
          git commit -m "chore: limpiar workflow temporal de sync"
          git push
